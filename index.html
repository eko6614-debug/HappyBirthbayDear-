# HappyBirthbayDear-
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>
<link href="https://fonts.cdnfonts.com/css/coolvetica" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(180deg, #000000 0%, #121212 55%, #2b2b2b 100%);
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .flower-wrap {
    position: relative;
    width: 300px;
    height: 500px;
    cursor: pointer;
  }

  /* ---------- stem (tapered ribbon, independent sway) ---------- */
  .stem-svg {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 220px;
    height: 340px;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    animation: stemSway 5.5s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes stemSway {
    0%   { transform: translateX(-50%) rotate(-3deg); }
    20%  { transform: translateX(-50%) rotate(1deg); }
    40%  { transform: translateX(-50%) rotate(-4deg); }
    60%  { transform: translateX(-50%) rotate(2deg); }
    80%  { transform: translateX(-50%) rotate(-1.5deg); }
    100% { transform: translateX(-50%) rotate(-3deg); }
  }

  /* ---------- bloom (independent sway + soft glow) ---------- */
  .bloom {
    position: absolute;
    bottom: 172px;
    left: 50%;
    width: 220px;
    height: 220px;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    z-index: 2;
    animation: bloomSway 4.8s ease-in-out infinite,
               glowPulse 3.6s ease-in-out infinite;
  }

  @keyframes bloomSway {
    0%   { transform: translateX(-50%) rotate(-2deg); }
    25%  { transform: translateX(-50%) rotate(1.5deg); }
    50%  { transform: translateX(-50%) rotate(-3deg); }
    75%  { transform: translateX(-50%) rotate(2deg); }
    100% { transform: translateX(-50%) rotate(-2deg); }
  }

  @keyframes glowPulse {
    0%,100% {
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.35))
              drop-shadow(0 0 16px rgba(255,255,255,0.2));
    }
    50% {
      filter: drop-shadow(0 0 14px rgba(255,255,255,0.55))
              drop-shadow(0 0 26px rgba(255,255,255,0.32));
    }
  }

  /* ---------- sepals (enlarged, behind petals) ---------- */
  .sepals {
    position: absolute;
    top: 62%;
    left: 50%;
    width: 90px;
    height: 90px;
    transform: translate(-50%, -50%);
    z-index: 0;
  }
  .sepal {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 17px;
    height: 56px;
    background: linear-gradient(180deg, #3f7d47, #2f6b38);
    border-radius: 50% 50% 0 0;
    transform-origin: bottom center;
  }
  .sepal:nth-child(1){ transform: translate(-50%,-100%) rotate(2deg); }
  .sepal:nth-child(2){ transform: translate(-50%,-100%) rotate(75deg); }
  .sepal:nth-child(3){ transform: translate(-50%,-100%) rotate(142deg); }
  .sepal:nth-child(4){ transform: translate(-50%,-100%) rotate(213deg); }
  .sepal:nth-child(5){ transform: translate(-50%,-100%) rotate(290deg); }

  /* ---------- petals (slot = fan position, inner = flutter) ---------- */
  .petals {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200px;
    height: 200px;
    transform: translate(-50%, -50%);
    z-index: 1;
  }

  .petal {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 54px;
    height: 90px;
    transform-origin: bottom center;
  }
  .petal:nth-child(1){ transform: translate(-50%,-100%) rotate(-1deg) skewX(-3deg); }
  .petal:nth-child(2){ transform: translate(-50%,-100%) rotate(58deg) skewX(2deg); }
  .petal:nth-child(3){ transform: translate(-50%,-100%) rotate(121deg) skewX(-2deg); }
  .petal:nth-child(4){ transform: translate(-50%,-100%) rotate(183deg) skewX(3deg); }
  .petal:nth-child(5){ transform: translate(-50%,-100%) rotate(239deg) skewX(-1deg); }
  .petal:nth-child(6){ transform: translate(-50%,-100%) rotate(302deg) skewX(2deg); }

  .petal-inner {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 30%, #ffffff 0%, #fbfdff 55%, #eaf3fb 100%);
    border-radius: 50% 50% 50% 50% / 68% 68% 32% 32%;
    box-shadow: 0 0 10px rgba(255,255,255,0.5) inset,
                0 0 6px rgba(255,255,255,0.3);
    opacity: 0.97;
    transform-origin: bottom center;
    animation-name: petalFlutter;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  @keyframes petalFlutter {
    0%   { transform: rotate(0deg); }
    30%  { transform: rotate(2.5deg); }
    55%  { transform: rotate(-1.5deg); }
    80%  { transform: rotate(1deg); }
    100% { transform: rotate(0deg); }
  }

  .petal:nth-child(1) .petal-inner { animation-duration: 3.6s; animation-delay: 0s; }
  .petal:nth-child(2) .petal-inner { animation-duration: 4.1s; animation-delay: 0.3s; }
  .petal:nth-child(3) .petal-inner { animation-duration: 3.8s; animation-delay: 0.6s; }
  .petal:nth-child(4) .petal-inner { animation-duration: 4.4s; animation-delay: 0.15s; }
  .petal:nth-child(5) .petal-inner { animation-duration: 3.9s; animation-delay: 0.45s; }
  .petal:nth-child(6) .petal-inner { animation-duration: 4.2s; animation-delay: 0.5s; }

  .center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 26px;
    height: 26px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, #fff9e0, #ffe9a8);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 240, 180, 0.7);
    z-index: 3;
  }

  .caption {
    margin-top: 26px;
    color: #ffffff;
    font-family: 'coolvetica', 'Segoe UI', sans-serif;
    font-size: 2.4em;
    letter-spacing: 1px;
    text-shadow: 0 0 6px rgba(255,255,255,0.6), 0 0 14px rgba(255,255,255,0.35);
    user-select: none;
  }

  .pollen {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff6cf;
    box-shadow: 0 0 6px 2px rgba(255, 245, 200, 0.9);
    pointer-events: none;
    animation: burst 1.1s ease-out forwards;
  }

  @keyframes burst {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: var(--end) scale(0.3); }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="flower-wrap" id="flower">

    <svg class="stem-svg" viewBox="0 0 220 340" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#5a9b62"/>
          <stop offset="100%" stop-color="#2c5c33"/>
        </linearGradient>
        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5f9e67"/>
          <stop offset="100%" stop-color="#33693c"/>
        </linearGradient>
      </defs>

      <path d="M107,338 C73.7,286 154.5,246 100.5,196 C63.5,164 116.5,108 98.5,50
               L101.5,50 C119.5,108 68.5,164 107.5,196 C161.5,246 82.3,286 117,338 Z"
            fill="url(#stemGrad)"/>

      <path d="M104,246 C142,228 168,240 156,262 C130,274 104,266 104,246 Z"
            fill="url(#leafGrad)" transform="rotate(-8 130 250)"/>

      <path d="M100,168 C64,154 42,170 56,190 C80,198 100,186 100,168 Z"
            fill="url(#leafGrad)" transform="rotate(10 71 176)"/>
    </svg>

    <div class="bloom">
      <div class="sepals">
        <div class="sepal"></div>
        <div class="sepal"></div>
        <div class="sepal"></div>
        <div class="sepal"></div>
        <div class="sepal"></div>
      </div>
      <div class="petals">
        <div class="petal"><div class="petal-inner"></div></div>
        <div class="petal"><div class="petal-inner"></div></div>
        <div class="petal"><div class="petal-inner"></div></div>
        <div class="petal"><div class="petal-inner"></div></div>
        <div class="petal"><div class="petal-inner"></div></div>
        <div class="petal"><div class="petal-inner"></div></div>
      </div>
      <div class="center" id="flowerCenter"></div>
    </div>

  </div>

  <div class="caption">Happy Birthday!</div>
</div>

<script>
  const flower = document.getElementById('flower');
  const center = document.getElementById('flowerCenter');

  flower.addEventListener('click', () => {
    const rect = center.getBoundingClientRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top + rect.height / 2;

    const count = 250;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'pollen';

      const angle = Math.random() * Math.PI * 2;
      const distance = 30 + Math.random() * 250;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance - 30;

      p.style.left = originX + 'px';
      p.style.top = originY + 'px';
      p.style.setProperty('--end', `translate(${dx}px, ${dy}px)`);
      p.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
      p.style.width = p.style.height = (4 + Math.random() * 4) + 'px';

      document.body.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  });
</script>

</body>
</html>
